<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Learning - التعلم الذكي</title>
    <style>
        body {
            /* تدرج بنفسجي تقني فخم */
            background: radial-gradient(circle at top left, #1a0b2e 20%, #3b1566 50%, #622599 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .site-title {
            text-align: center;
            font-style: italic;
            /* لون ذهبي مشع يتناسب مع ثيم الذكاء والتعلم */
            color: #ffd700; 
            font-size: 40px;
            margin-top: 40px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* حاوية الجريد الذكية لترتيب الكروت */
        .the-site {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* تصميم كروت المواد */
        .section-card {
           
            border-radius: 20px;
            border: #7b4397 solid 2px;
            padding: 20px;
            background-color: #f3e5f5; /* بنفسجي فاتح جداً مائل للأبيض لتوضيح النص */
            height: 250px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            margin: 15px;
        }

        /* تأثير حركي تفاعلي عند تمرير الماوس */
        .section-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(153, 50, 204, 0.4);
        }

        .section-img {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        .section-h1 {
            text-align: center;
            color: #2b0b4d; /* بنفسجي داكن جداً للنصوص */
            font-size: 22px;
            margin: 0;
            font-weight: bold;
        }

        /* زر الإجراء (إذا رغبت في استخدامه مستقبلاً داخل الكروت) */
        .sections-button {
            display: inline-block;
            color: white;
            background-color: #7b2cbf;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .sections-button:hover {
            background-color: #9d4edd;
        }

        /* التجاوب التام مع الهواتف والتابلت */
        @media (max-width: 1024px) {
            .the-site { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .the-site { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .the-site { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <div class="Smart-learning">
        <h1 class="site-title">التعلم الذكي</h1>

        <div class="the-site">
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">البرمجة</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الروبوتات</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الذكاء الاصطناعي</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الأمن الرقمي</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">تصميم صفحات الويب</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">تصميم التطبيقات</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">تصميم الألعاب</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الرسم ثلاثي الأبعاد</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الإلكترونيات</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">الأمن السيبراني</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">جمع البيانات</h1>
            </div>
            <div class="section-card">
                <img class="section-img" src="IMG/laptop.png" alt="laptop">
                <h1 class="section-h1">إنترنت الأشياء</h1>
            </div>
        </div>
    </div>

</body>
</html>
